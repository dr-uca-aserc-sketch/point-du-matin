name: Le Point du Matin
on: {schedule: [{cron: "30 4 * * *"}, {cron: "30 5 * * *"}], workflow_dispatch: {}}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: briefing, cancel-in-progress: false}
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - {uses: actions/checkout@v4}
      - {uses: actions/setup-node@v4, with: {node-version: "20"}}
      - name: Compose
        id: compose
        continue-on-error: true
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}", GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"}
        run: node scripts/compose.mjs
      - name: Commit
        if: steps.compose.outcome == 'success'
        run: git config user.name bot && git config user.email bot@github.com && git add editions && (git diff --staged --quiet || git commit -m "Edition") && git push
      - {uses: actions/configure-pages@v5}
      - {uses: actions/upload-pages-artifact@v3, with: {path: .}}
      - {id: deploy, uses: actions/deploy-pages@v4}
      - name: Notify
        env: {TELEGRAM_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}", TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}", SITE_URL: "${{ steps.deploy.outputs.page_url }}"}
        run: node scripts/notify.mjs
      - name: Fail if compose failed
        if: steps.compose.outcome != 'success'
        run: exit 1
        
